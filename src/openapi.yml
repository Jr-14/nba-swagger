  /stats/boxscoremiscv3:
    get:
      operationId: getBoxScoreMiscV3
      tags: [Stats]
      summary: boxscoremiscv3
      description: >-
        Returns player and team miscellaneous box score statistics for a game,
        including scoring situations, blocks, and fouls. Unlike V2, the V3
        response is nested JSON grouped by home and away teams. Requests can use
        either the proxy Worker or the NBA Stats API directly.
      parameters:
        - name: GameID
          in: query
          required: true
          description: NBA game identifier.
          schema:
            type: string
            pattern: '^\d{10}$'
          example: "0022200552"
        - name: EndPeriod
          in: query
          required: true
          description: Period to end at; 0 includes all periods.
          schema:
            type: string
            pattern: '^\d+$'
            default: "0"
        - name: EndRange
          in: query
          required: true
          description: End of the clock range within the period.
          schema:
            type: string
            default: "0"
        - name: RangeType
          in: query
          required: true
          description: Range type; 0 selects the full period range.
          schema:
            type: string
            default: "0"
        - name: StartPeriod
          in: query
          required: true
          description: Period to start at; 0 starts at the beginning of the game.
          schema:
            type: string
            pattern: '^\d+$'
            default: "0"
        - name: StartRange
          in: query
          required: true
          description: Start of the clock range within the period.
          schema:
            type: string
            default: "0"
      responses:
        '200':
          description: Nested miscellaneous box score grouped by home and away teams.
          content:
            application/json:
