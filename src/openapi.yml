openapi: 3.0.3
info:
  title: NBA API
  version: 1.0.0
  description: OpenAPI documentation for NBA Stats and Live APIs.
tags:
  - name: Stats
    description: NBA Stats API endpoints.
  - name: Live
    description: NBA Live Data CDN endpoints.
servers:
  - url: https://nba-swagger-proxy.jr-jemerson14.workers.dev/api
    description: NBA API proxy
  - url: https://stats.nba.com
    description: NBA Stats API direct (browser CORS may block requests)
paths:
  /stats/alltimeleadersgrids:
    get:
      operationId: getAllTimeLeadersGrids
      tags: [Stats]
      summary: alltimeleadersgrids
      description: >-
        Returns leader tables for 19 statistical categories. Requests can use
        either the proxy Worker or the NBA Stats API directly.
      parameters:
        - $ref: '#/components/parameters/LeagueID'
        - name: PerMode
          in: query
          required: true
          description: Statistical totals or per-game values.
          schema:
            type: string
            enum: [Totals, PerGame]
            default: Totals
        - name: SeasonType
          in: query
          required: true
          schema:
            type: string
            enum: [Regular Season, Pre Season, PlayIn, Playoffs]
            default: Regular Season
        - name: TopX
          in: query
          required: true
          description: Number of leaders returned per category.
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Leader tables returned by the NBA Stats API.
          content:
            application/json:
              schema:
                type: object
                required: [resource, resultSets]
                properties:
                  resource:
                    type: string
                    example: alltimeleadersgrids
                  parameters:
                    description: Echo of the supplied query parameters.
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: array
                        items:
                          type: object
                          additionalProperties: true
                  resultSets:
                    type: array
                    description: One result set for each statistical category.
                    items:
                      type: object
                      required: [name, headers, rowSet]
                      properties:
                        name:
                          type: string
                          enum:
                            - ASTLeaders
                            - BLKLeaders
                            - DREBLeaders
                            - FG3ALeaders
                            - FG3MLeaders
                            - FG3_PCTLeaders
                            - FGALeaders
                            - FGMLeaders
                            - FG_PCTLeaders
                            - FTALeaders
                            - FTMLeaders
                            - FT_PCTLeaders
                            - GPLeaders
                            - OREBLeaders
                            - PFLeaders
                            - PTSLeaders
                            - REBLeaders
                            - STLLeaders
                            - TOVLeaders
                        headers:
                          type: array
                          items:
                            type: string
                        rowSet:
                          type: array
                          description: Rows aligned by position with the headers array.
                          items:
                            type: array
                            items:
                              oneOf:
                                - type: integer
                                - type: number
                                - type: string
                                - type: boolean
              examples:
                pointsLeaders:
                  summary: Points leader table
                  value:
                    resource: alltimeleadersgrids
                    parameters:
                      LeagueID: "00"
                      PerMode: Totals
                      SeasonType: Regular Season
                      TopX: 10
                    resultSets:
                      - name: PTSLeaders
                        headers: [PLAYER_ID, PLAYER_NAME, PTS, PTS_RANK, IS_ACTIVE_FLAG]
                        rowSet:
                          - [2544, LeBron James, 40474, 1, Y]
  /stats/assistleaders:
    get:
      operationId: getAssistLeaders
      tags: [Stats]
      summary: assistleaders
      description: >-
        Returns assist leaders for a league, season, and player-or-team scope.
        Deprecated upstream: the NBA Stats API no longer returns JSON for this
        endpoint and responds with the NBA.com homepage instead. Use
        LeagueDashPlayerStats or LeagueDashTeamStats for assist totals. Requests
        can use either the proxy Worker or the NBA Stats API directly.
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/LeagueID'
        - name: PerMode
          in: query
          required: true
          description: Statistical totals or per-game values.
          schema:
            type: string
            enum: [Totals, PerGame]
            default: Totals
        - name: PlayerOrTeam
          in: query
          required: true
          description: Return player or team assist leaders.
          schema:
            type: string
            enum: [Player, Team]
            default: Team
        - name: Season
          in: query
          required: true
          description: NBA season in YYYY-YY format.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            default: "2025-26"
          example: "2025-26"
        - name: SeasonType
          in: query
          required: true
          schema:
            type: string
            enum: [Regular Season, Pre Season, PlayIn, Playoffs]
            default: Regular Season
      responses:
        '200':
          description: Assist leaders returned by the NBA Stats API.
          content:
            application/json:
              schema:
                type: object
                required: [resource, resultSets]
                properties:
                  resource:
                    type: string
                    example: assistleaders
                  parameters:
                    description: Echo of the supplied query parameters.
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: array
                        items:
                          type: object
                          additionalProperties: true
                  resultSets:
                    type: array
                    description: Assist leader table returned by the endpoint.
                    items:
                      type: object
                      required: [name, headers, rowSet]
                      properties:
                        name:
                          type: string
                          enum:
                            - AssistLeaders
                        headers:
                          type: array
                          items:
                            type: string
                        rowSet:
                          type: array
                          description: Rows aligned by position with the headers array.
                          items:
                            type: array
                            items:
                              oneOf:
                                - type: integer
                                - type: number
                                - type: string
                                - type: boolean
              examples:
                teamAssistLeaders:
                  summary: Team assist leader table
                  value:
                    resource: assistleaders
                    parameters:
                      LeagueID: "00"
                      Season: "2025-26"
                      SeasonType: Regular Season
                      PerMode: Totals
                      PlayerOrTeam: Team
                    resultSets:
                      - name: AssistLeaders
                        headers: [RANK, TEAM_ID, TEAM_ABBREVIATION, TEAM_NAME, AST]
                        rowSet:
                          - [1, 1610612737, ATL, Atlanta Hawks, 1760]
                          - [2, 1610612762, UTA, Utah Jazz, 1712]
                          - [3, 1610612748, MIA, Miami Heat, 1667]
                          - [4, 1610612741, CHI, Chicago Bulls, 1656]
                          - [5, 1610612761, TOR, Toronto Raptors, 1636]
  /stats/assisttracker:
    get:
      operationId: getAssistTracker
      tags: [Stats]
      summary: assisttracker
      description: >-
        Returns the total number of assists matching the supplied filters.
        Deprecated upstream: the NBA Stats API no longer returns JSON for this
        endpoint and responds with the NBA.com homepage instead. There is no
        direct replacement. Requests can use either the proxy Worker or the NBA
        Stats API directly.
      deprecated: true
      parameters:
        - name: College
          in: query
          required: false
          description: Filter by college name.
          schema:
            type: string
        - name: Conference
          in: query
          required: false
          description: Filter by the player's conference.
          schema:
            type: string
            enum: [East, West]
        - name: Country
          in: query
          required: false
          description: Filter by the player's country.
          schema:
            type: string
        - name: DateFrom
          in: query
          required: false
          description: Start date in MM/DD/YYYY format.
          schema:
            type: string
        - name: DateTo
          in: query
          required: false
          description: End date in MM/DD/YYYY format.
          schema:
            type: string
        - name: Division
          in: query
          required: false
          description: Filter by the player's division.
          schema:
            type: string
            enum: [Atlantic, Central, Northwest, Pacific, Southeast, Southwest]
        - name: DraftPick
          in: query
          required: false
          description: Filter by draft pick.
          schema:
            type: string
        - name: DraftYear
          in: query
          required: false
          description: Filter by draft year.
          schema:
            type: integer
        - name: GameScope
          in: query
          required: false
          description: Filter to a recent game window.
          schema:
            type: string
            enum: [Last 10, Yesterday]
        - name: Height
          in: query
          required: false
          description: Filter by player height.
          schema:
            type: string
        - name: LastNGames
          in: query
          required: false
          description: Number of most recent games to include; 0 includes all games.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: LeagueID
          in: query
          required: false
          description: League identifier.
          schema:
            type: string
            enum: ["00", "01", "10", "15", "20"]
            default: "00"
          example: "00"
        - name: Location
          in: query
          required: false
          description: Filter by home or road games.
          schema:
            type: string
            enum: [Home, Road]
        - name: Month
          in: query
          required: false
          description: Filter by calendar month; 0 includes all months.
          schema:
            type: integer
            minimum: 0
            maximum: 12
            default: 0
        - name: OpponentTeamID
          in: query
          required: false
          description: Filter by opponent team identifier.
          schema:
            type: integer
        - name: Outcome
          in: query
          required: false
          description: Filter by game outcome.
          schema:
            type: string
            enum: [W, L]
        - name: PORound
          in: query
          required: false
          description: Filter by playoff round.
          schema:
            type: integer
        - name: PerMode
          in: query
          required: false
          description: Statistical totals or per-game values.
          schema:
            type: string
            enum: [Totals, PerGame]
        - name: PlayerExperience
          in: query
          required: false
          description: Filter by player experience.
          schema:
            type: string
            enum: [Rookie, Sophomore, Veteran]
        - name: PlayerPosition
          in: query
          required: false
          description: Filter by player position.
          schema:
            type: string
            enum: [F, C, G, C-F, F-C, F-G, G-F]
        - name: Season
          in: query
          required: false
          description: NBA season in YYYY-YY format.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          example: "2025-26"
        - name: SeasonSegment
          in: query
          required: false
          description: Filter by pre- or post-All-Star games.
          schema:
            type: string
            enum: [Post All-Star, Pre All-Star]
        - name: SeasonType
          in: query
          required: false
          description: Season type.
          schema:
            type: string
            enum: [Regular Season, Pre Season, Playoffs, All Star]
        - name: StarterBench
          in: query
          required: false
          description: Filter by starters or bench players.
          schema:
            type: string
            enum: [Starters, Bench]
        - name: TeamID
          in: query
          required: false
          description: Filter by team identifier.
          schema:
            type: integer
        - name: VsConference
          in: query
          required: false
          description: Filter by opponent conference.
          schema:
            type: string
            enum: [East, West]
        - name: VsDivision
          in: query
          required: false
          description: Filter by opponent division.
          schema:
            type: string
            enum: [Atlantic, Central, Northwest, Pacific, Southeast, Southwest, East, West]
        - name: Weight
          in: query
          required: false
          description: Filter by player weight.
          schema:
            type: string
      responses:
        '200':
          description: Assist total returned by the NBA Stats API.
          content:
            application/json:
              schema:
                type: object
                required: [resource, resultSets]
                properties:
                  resource:
                    type: string
                    example: assisttracker
                  parameters:
                    description: Echo of the supplied query parameters.
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: array
                        items:
                          type: object
                          additionalProperties: true
                  resultSets:
                    type: array
                    description: Single-row table containing the matching assist total.
                    items:
                      type: object
                      required: [name, headers, rowSet]
                      properties:
                        name:
                          type: string
                          enum:
                            - AssistTracker
                        headers:
                          type: array
                          items:
                            type: string
                        rowSet:
                          type: array
                          description: Rows aligned by position with the headers array.
                          items:
                            type: array
                            items:
                              oneOf:
                                - type: integer
                                - type: number
                                - type: string
                                - type: boolean
              examples:
                assistTotal:
                  summary: Total assists matching the default filters
                  value:
                    resource: assisttracker
                    parameters:
                      PerMode: null
                      LeagueID: "00"
                      Season: null
                      SeasonType: Regular Season
                      PORound: null
                      Outcome: null
                      Location: null
                      Month: null
                      SeasonSegment: null
                      DateFrom: null
                      DateTo: null
                      OpponentTeamID: null
                      VsConference: null
                      VsDivision: null
                      TeamID: null
                      Conference: null
                      Division: null
                      LastNGames: null
                      GameScope: null
                      PlayerExperience: null
                      PlayerPosition: null
                      StarterBench: null
                      DraftYear: null
                      DraftPick: null
                      College: null
                      Country: null
                      Height: null
                      Weight: null
                    resultSets:
                      - name: AssistTracker
                        headers: [ASSISTS]
                        rowSet:
                          - [1692425]
  /stats/boxscoreadvancedv2:
    get:
      operationId: getBoxScoreAdvancedV2
      tags: [Stats]
      summary: boxscoreadvancedv2
      description: >-
        Returns player and team advanced box score statistics for a game.
        Deprecated upstream: the NBA Stats API no longer returns data for this
        endpoint and responds with an empty JSON object. Use BoxScoreAdvancedV3
        instead. Requests can use either the proxy Worker or the NBA Stats API
        directly.
      deprecated: true
      parameters:
        - name: GameID
          in: query
          required: true
          description: NBA game identifier.
          schema:
            type: string
            pattern: '^\d{10}$'
          example: "0022300061"
        - name: EndPeriod
          in: query
          required: true
          description: Period to end at; 0 includes all periods.
          schema:
            type: string
            pattern: '^\d+$'
            default: "0"
        - name: EndRange
          in: query
          required: true
          description: End of the clock range within the period.
          schema:
            type: string
            default: "0"
        - name: RangeType
          in: query
          required: true
          description: Range type; 0 selects the full period range.
          schema:
            type: string
            default: "0"
        - name: StartPeriod
          in: query
          required: true
          description: Period to start at; 0 starts at the beginning of the game.
          schema:
            type: string
            pattern: '^\d+$'
            default: "0"
        - name: StartRange
          in: query
          required: true
          description: Start of the clock range within the period.
          schema:
            type: string
            default: "0"
      responses:
        '200':
          description: Player and team advanced box score tables.
          content:
            application/json:
              schema:
                type: object
                required: [resource, resultSets]
                properties:
                  resource:
                    type: string
                    example: boxscoreadvancedv2
                  parameters:
                    description: Echo of the supplied query parameters.
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: array
                        items:
                          type: object
                          additionalProperties: true
                  resultSets:
                    type: array
                    description: One player table and one team table.
                    items:
                      type: object
                      required: [name, headers, rowSet]
                      properties:
                        name:
                          type: string
                          enum:
                            - PlayerStats
                            - TeamStats
                        headers:
                          type: array
                          items:
                            type: string
                        rowSet:
                          type: array
                          description: Rows aligned by position with the headers array.
                          items:
                            type: array
                            items:
                              oneOf:
                                - type: integer
                                - type: number
                                - type: string
                                - type: boolean
              examples:
                gameBoxScore:
                  summary: Advanced box score for one game
                  value:
                    resource: boxscoreadvancedv2
                    parameters:
                      GameID: "0022300061"
                      EndPeriod: "0"
                      EndRange: "0"
                      RangeType: "0"
                      StartPeriod: "0"
                      StartRange: "0"
                    resultSets:
                      - name: PlayerStats
                        headers: [GAME_ID, TEAM_ID, TEAM_ABBREVIATION, TEAM_CITY, PLAYER_ID, PLAYER_NAME, START_POSITION, COMMENT, MIN, E_OFF_RATING, OFF_RATING, E_DEF_RATING, DEF_RATING, E_NET_RATING, NET_RATING, AST_PCT, AST_TOV, AST_RATIO, OREB_PCT, DREB_PCT, REB_PCT, TM_TOV_PCT, EFG_PCT, TS_PCT, USG_PCT, E_USG_PCT, E_PACE, PACE, PACE_PER40, POSS, PIE]
                        rowSet:
                          - ["0022300061", 1610612747, LAL, Los Angeles, 2544, LeBron James, F, "", "29:01", 132.7, 126.7, 114.6, 119, 18.1, 7.7, 0.263, 0, 23.8, 0.033, 0.25, 0.138, 0, 0.656, 0.639, 0.225, 0.245, 97.19, 97.62, 81.35, 60, 0.189]
                      - name: TeamStats
                        headers: [GAME_ID, TEAM_ID, TEAM_NAME, TEAM_ABBREVIATION, TEAM_CITY, MIN, E_OFF_RATING, OFF_RATING, E_DEF_RATING, DEF_RATING, E_NET_RATING, NET_RATING, AST_PCT, AST_TOV, AST_RATIO, OREB_PCT, DREB_PCT, REB_PCT, E_TM_TOV_PCT, TM_TOV_PCT, EFG_PCT, TS_PCT, USG_PCT, E_USG_PCT, E_PACE, PACE, PACE_PER40, POSS, PIE]
                        rowSet:
                          - ["0022300061", 1610612747, Lakers, LAL, Los Angeles, "240:00", 109.4, 111.5, 119.9, 125.3, -10.5, -13.8, 0.561, 1.92, 17.2, 0.346, 0.711, 0.515, 12.27, 12.5, 0.511, 0.541, 1, 0.199, 98.54, 95.5, 79.58, 96, 0.421]
  /stats/boxscoreadvancedv3:
    get:
      operationId: getBoxScoreAdvancedV3
      tags: [Stats]
      summary: boxscoreadvancedv3
      description: >-
        Returns player and team advanced box score statistics for a game. Unlike
        V2, the V3 response is nested JSON grouped by home and away teams.
        Requests can use either the proxy Worker or the NBA Stats API directly.
      parameters:
        - name: GameID
          in: query
          required: true
          description: NBA game identifier.
          schema:
            type: string
            pattern: '^\d{10}$'
          example: "0022200552"
        - name: EndPeriod
          in: query
          required: true
          description: Period to end at; 0 includes all periods.
          schema:
            type: string
            pattern: '^\d+$'
            default: "0"
        - name: EndRange
          in: query
          required: true
          description: End of the clock range within the period.
          schema:
            type: string
            default: "0"
        - name: RangeType
          in: query
          required: true
          description: Range type; 0 selects the full period range.
          schema:
            type: string
            default: "0"
        - name: StartPeriod
          in: query
          required: true
          description: Period to start at; 0 starts at the beginning of the game.
          schema:
            type: string
            pattern: '^\d+$'
            default: "0"
        - name: StartRange
          in: query
          required: true
          description: Start of the clock range within the period.
          schema:
            type: string
            default: "0"
      responses:
        '200':
          description: Nested advanced box score grouped by home and away teams.
          content:
            application/json:
              schema:
                type: object
                required: [meta, boxScoreAdvanced]
                properties:
                  meta:
                    $ref: '#/components/schemas/BoxScoreAdvancedV3Meta'
                  boxScoreAdvanced:
                    type: object
                    required: [gameId, awayTeamId, homeTeamId, homeTeam, awayTeam]
                    properties:
                      gameId:
                        type: string
                        pattern: '^\d{10}$'
                      awayTeamId:
                        type: integer
                      homeTeamId:
