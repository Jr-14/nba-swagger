openapi: 3.0.3
info:
  title: NBA API
  version: 1.0.0
  description: OpenAPI documentation for NBA Stats and Live APIs.
tags:
  - name: Stats
    description: NBA Stats API endpoints.
servers:
  - url: https://nba-swagger-proxy.jr-jemerson14.workers.dev/api
    description: NBA API proxy
  - url: https://stats.nba.com
    description: NBA Stats API direct (browser CORS may block requests)
paths:
  /stats/alltimeleadersgrids:
    get:
      operationId: getAllTimeLeadersGrids
      tags: [Stats]
      summary: alltimeleadersgrids
      description: >-
        Returns leader tables for 19 statistical categories. Requests can use
        either the proxy Worker or the NBA Stats API directly.
      parameters:
        - $ref: '#/components/parameters/LeagueID'
        - name: PerMode
          in: query
          required: true
          description: Statistical totals or per-game values.
          schema:
            type: string
            enum: [Totals, PerGame]
            default: Totals
        - name: SeasonType
          in: query
          required: true
          schema:
            type: string
            enum: [Regular Season, Pre Season, PlayIn, Playoffs]
            default: Regular Season
        - name: TopX
          in: query
          required: true
          description: Number of leaders returned per category.
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Leader tables returned by the NBA Stats API.
          content:
            application/json:
              schema:
                type: object
                required: [resource, resultSets]
                properties:
                  resource:
                    type: string
                    example: alltimeleadersgrids
                  parameters:
                    description: Echo of the supplied query parameters.
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: array
                        items:
                          type: object
                          additionalProperties: true
                  resultSets:
                    type: array
                    description: One result set for each statistical category.
                    items:
                      type: object
                      required: [name, headers, rowSet]
                      properties:
                        name:
                          type: string
                          enum:
                            - ASTLeaders
                            - BLKLeaders
                            - DREBLeaders
                            - FG3ALeaders
                            - FG3MLeaders
                            - FG3_PCTLeaders
                            - FGALeaders
                            - FGMLeaders
                            - FG_PCTLeaders
                            - FTALeaders
                            - FTMLeaders
                            - FT_PCTLeaders
                            - GPLeaders
                            - OREBLeaders
                            - PFLeaders
                            - PTSLeaders
                            - REBLeaders
                            - STLLeaders
                            - TOVLeaders
                        headers:
                          type: array
                          items:
                            type: string
                        rowSet:
                          type: array
                          description: Rows aligned by position with the headers array.
                          items:
                            type: array
                            items:
                              oneOf:
                                - type: integer
                                - type: number
                                - type: string
                                - type: boolean
              examples:
                pointsLeaders:
                  summary: Points leader table
                  value:
                    resource: alltimeleadersgrids
                    parameters:
                      LeagueID: "00"
                      PerMode: Totals
                      SeasonType: Regular Season
                      TopX: 10
                    resultSets:
                      - name: PTSLeaders
                        headers: [PLAYER_ID, PLAYER_NAME, PTS, PTS_RANK, IS_ACTIVE_FLAG]
                        rowSet:
                          - [2544, LeBron James, 40474, 1, Y]
  /stats/assistleaders:
    get:
      operationId: getAssistLeaders
      tags: [Stats]
      summary: assistleaders
      description: >-
        Returns assist leaders for a league, season, and player-or-team scope.
        Deprecated upstream: the NBA Stats API no longer returns JSON for this
        endpoint and responds with the NBA.com homepage instead. Use
        LeagueDashPlayerStats or LeagueDashTeamStats for assist totals. Requests
        can use either the proxy Worker or the NBA Stats API directly.
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/LeagueID'
        - name: PerMode
          in: query
          required: true
          description: Statistical totals or per-game values.
          schema:
            type: string
            enum: [Totals, PerGame]
            default: Totals
        - name: PlayerOrTeam
          in: query
          required: true
          description: Return player or team assist leaders.
          schema:
            type: string
            enum: [Player, Team]
            default: Team
        - name: Season
          in: query
          required: true
          description: NBA season in YYYY-YY format.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            default: "2025-26"
          example: "2025-26"
        - name: SeasonType
          in: query
          required: true
          schema:
            type: string
            enum: [Regular Season, Pre Season, PlayIn, Playoffs]
            default: Regular Season
      responses:
        '200':
          description: Assist leaders returned by the NBA Stats API.
          content:
            application/json:
              schema:
                type: object
                required: [resource, resultSets]
                properties:
                  resource:
                    type: string
                    example: assistleaders
                  parameters:
                    description: Echo of the supplied query parameters.
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: array
                        items:
                          type: object
                          additionalProperties: true
                  resultSets:
                    type: array
                    description: Assist leader table returned by the endpoint.
                    items:
                      type: object
                      required: [name, headers, rowSet]
                      properties:
                        name:
                          type: string
                          enum:
                            - AssistLeaders
                        headers:
                          type: array
                          items:
                            type: string
                        rowSet:
                          type: array
                          description: Rows aligned by position with the headers array.
                          items:
                            type: array
                            items:
                              oneOf:
                                - type: integer
                                - type: number
                                - type: string
                                - type: boolean
              examples:
                teamAssistLeaders:
                  summary: Team assist leader table
                  value:
                    resource: assistleaders
                    parameters:
                      LeagueID: "00"
                      Season: "2025-26"
                      SeasonType: Regular Season
                      PerMode: Totals
                      PlayerOrTeam: Team
                    resultSets:
                      - name: AssistLeaders
                        headers: [RANK, TEAM_ID, TEAM_ABBREVIATION, TEAM_NAME, AST]
                        rowSet:
                          - [1, 1610612737, ATL, Atlanta Hawks, 1760]
                          - [2, 1610612762, UTA, Utah Jazz, 1712]
                          - [3, 1610612748, MIA, Miami Heat, 1667]
                          - [4, 1610612741, CHI, Chicago Bulls, 1656]
                          - [5, 1610612761, TOR, Toronto Raptors, 1636]
  /stats/assisttracker:
    get:
      operationId: getAssistTracker
      tags: [Stats]
      summary: assisttracker
      description: >-
        Returns the total number of assists matching the supplied filters.
        Deprecated upstream: the NBA Stats API no longer returns JSON for this
        endpoint and responds with the NBA.com homepage instead. There is no
        direct replacement. Requests can use either the proxy Worker or the NBA
        Stats API directly.
      deprecated: true
      parameters:
        - name: College
          in: query
          required: false
          description: Filter by college name.
          schema:
            type: string
        - name: Conference
          in: query
          required: false
          description: Filter by the player's conference.
          schema:
            type: string
            enum: [East, West]
        - name: Country
          in: query
          required: false
          description: Filter by the player's country.
          schema:
            type: string
        - name: DateFrom
          in: query
          required: false
          description: Start date in MM/DD/YYYY format.
          schema:
            type: string
        - name: DateTo
          in: query
          required: false
          description: End date in MM/DD/YYYY format.
          schema:
            type: string
        - name: Division
          in: query
          required: false
          description: Filter by the player's division.
          schema:
            type: string
            enum: [Atlantic, Central, Northwest, Pacific, Southeast, Southwest]
        - name: DraftPick
          in: query
          required: false
          description: Filter by draft pick.
          schema:
            type: string
        - name: DraftYear
          in: query
          required: false
          description: Filter by draft year.
          schema:
            type: integer
        - name: GameScope
          in: query
          required: false
          description: Filter to a recent game window.
          schema:
            type: string
            enum: [Last 10, Yesterday]
        - name: Height
          in: query
          required: false
          description: Filter by player height.
          schema:
            type: string
        - name: LastNGames
          in: query
          required: false
          description: Number of most recent games to include; 0 includes all games.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: LeagueID
          in: query
          required: false
          description: League identifier.
          schema:
            type: string
            enum: ["00", "01", "10", "15", "20"]
            default: "00"
          example: "00"
        - name: Location
          in: query
          required: false
          description: Filter by home or road games.
          schema:
            type: string
            enum: [Home, Road]
        - name: Month
          in: query
          required: false
          description: Filter by calendar month; 0 includes all months.
          schema:
            type: integer
            minimum: 0
            maximum: 12
            default: 0
        - name: OpponentTeamID
          in: query
          required: false
          description: Filter by opponent team identifier.
          schema:
            type: integer
        - name: Outcome
          in: query
          required: false
          description: Filter by game outcome.
          schema:
            type: string
            enum: [W, L]
        - name: PORound
          in: query
          required: false
          description: Filter by playoff round.
          schema:
            type: integer
        - name: PerMode
          in: query
          required: false
          description: Statistical totals or per-game values.
          schema:
            type: string
            enum: [Totals, PerGame]
        - name: PlayerExperience
          in: query
          required: false
          description: Filter by player experience.
          schema:
            type: string
            enum: [Rookie, Sophomore, Veteran]
        - name: PlayerPosition
          in: query
          required: false
          description: Filter by player position.
          schema:
            type: string
            enum: [F, C, G, C-F, F-C, F-G, G-F]
        - name: Season
          in: query
          required: false
          description: NBA season in YYYY-YY format.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          example: "2025-26"
        - name: SeasonSegment
          in: query
          required: false
          description: Filter by pre- or post-All-Star games.
          schema:
            type: string
            enum: [Post All-Star, Pre All-Star]
        - name: SeasonType
          in: query
          required: false
          description: Season type.
          schema:
            type: string
            enum: [Regular Season, Pre Season, Playoffs, All Star]
        - name: StarterBench
          in: query
          required: false
          description: Filter by starters or bench players.
          schema:
            type: string
            enum: [Starters, Bench]
        - name: TeamID
          in: query
          required: false
          description: Filter by team identifier.
          schema:
            type: integer
        - name: VsConference
          in: query
          required: false
          description: Filter by opponent conference.
          schema:
            type: string
            enum: [East, West]
        - name: VsDivision
          in: query
          required: false
          description: Filter by opponent division.
          schema:
            type: string
            enum: [Atlantic, Central, Northwest, Pacific, Southeast, Southwest, East, West]
        - name: Weight
          in: query
          required: false
          description: Filter by player weight.
          schema:
            type: string
      responses:
        '200':
          description: Assist total returned by the NBA Stats API.
          content:
            application/json:
              schema:
                type: object
                required: [resource, resultSets]
                properties:
                  resource:
                    type: string
                    example: assisttracker
                  parameters:
                    description: Echo of the supplied query parameters.
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: array
                        items:
                          type: object
                          additionalProperties: true
                  resultSets:
                    type: array
                    description: Single-row table containing the matching assist total.
                    items:
                      type: object
                      required: [name, headers, rowSet]
                      properties:
                        name:
                          type: string
                          enum:
                            - AssistTracker
                        headers:
                          type: array
                          items:
                            type: string
                        rowSet:
                          type: array
                          description: Rows aligned by position with the headers array.
                          items:
                            type: array
                            items:
                              oneOf:
                                - type: integer
                                - type: number
                                - type: string
                                - type: boolean
              examples:
                assistTotal:
                  summary: Total assists matching the default filters
                  value:
                    resource: assisttracker
                    parameters:
                      PerMode: null
                      LeagueID: "00"
                      Season: null
                      SeasonType: Regular Season
                      PORound: null
                      Outcome: null
                      Location: null
                      Month: null
                      SeasonSegment: null
                      DateFrom: null
                      DateTo: null
                      OpponentTeamID: null
                      VsConference: null
                      VsDivision: null
                      TeamID: null
                      Conference: null
                      Division: null
                      LastNGames: null
                      GameScope: null
                      PlayerExperience: null
                      PlayerPosition: null
                      StarterBench: null
                      DraftYear: null
                      DraftPick: null
                      College: null
                      Country: null
                      Height: null
                      Weight: null
                    resultSets:
                      - name: AssistTracker
                        headers: [ASSISTS]
                        rowSet:
                          - [1692425]
components:
  parameters:
    LeagueID:
      name: LeagueID
      in: query
      required: true
      description: |
        League identifier from the NBA Stats API's undocumented parameter
        conventions. Use a quoted two-character string; leading zeros are
        significant.

        - `"00"`: NBA
        - `"01"`: ABA (American Basketball Association, historical)
        - `"10"`: WNBA
        - `"15"`: NBA G League (formerly NBA Development League)
        - `"20"`: NBA Summer League

        `"00"` is the usual default. Not every endpoint supports every league;
        unsupported combinations may return empty results or an error.
      schema:
        type: string
        enum: ["00", "01", "10", "15", "20"]
        default: "00"
      example: "00"
