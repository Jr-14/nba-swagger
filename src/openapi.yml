        teamCity:
          type: string
        teamName:
          type: string
        teamTricode:
          type: string
        teamSlug:
          type: string
        players:
          type: array
          items:
            type: object
            required: [personId, firstName, familyName, nameI, playerSlug, position, comment, jerseyNum, statistics]
            properties:
              personId:
                type: integer
              firstName:
                type: string
              familyName:
                type: string
              nameI:
                type: string
              playerSlug:
                type: string
              position:
                type: string
              comment:
                type: string
              jerseyNum:
                type: string
              statistics:
