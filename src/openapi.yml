                  parameters: { type: object, additionalProperties: true }
                  resultSets:
                    type: array
                    items:
                      type: object
                      required: [name, headers, rowSet]
                      properties:
                        name: { type: string, enum: [TeamGameLogs] }
                        headers: { type: array, items: { type: string } }
                        rowSet:
