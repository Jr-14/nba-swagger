  /stats/teamgamelogs:
    get:
      operationId: getTeamGameLogs
      tags: [Stats]
      summary: teamgamelogs
      description: Returns game logs for one or more teams, with optional game, opponent, date, and split filters.
      parameters:
        - { name: DateFrom, in: query, required: false, schema: { type: string, nullable: true }, example: "01/01/2024" }
        - { name: DateTo, in: query, required: false, schema: { type: string, nullable: true }, example: "01/31/2024" }
        - { name: GameSegment, in: query, required: false, schema: { type: string, enum: [First Half, Overtime, Second Half], nullable: true } }
        - { name: LastNGames, in: query, required: false, schema: { type: integer, nullable: true } }
        - { name: LeagueID, in: query, required: false, schema: { type: string, nullable: true, default: "00" } }
        - { name: Location, in: query, required: false, schema: { type: string, enum: [Home, Road], nullable: true } }
        - { name: MeasureType, in: query, required: false, schema: { type: string, nullable: true } }
        - { name: Month, in: query, required: false, schema: { type: integer, nullable: true } }
        - { name: OppTeamID, in: query, required: false, schema: { type: integer, nullable: true } }
        - { name: Outcome, in: query, required: false, schema: { type: string, enum: [W, L], nullable: true } }
        - { name: PORound, in: query, required: false, schema: { type: integer, nullable: true } }
        - { name: PerMode, in: query, required: false, schema: { type: string, enum: [Totals, PerGame], nullable: true } }
        - { name: Period, in: query, required: false, schema: { type: integer, nullable: true } }
        - { name: PlayerID, in: query, required: false, schema: { type: integer, nullable: true }, example: 0 }
        - name: Season
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
          example: "2023-24"
        - { name: SeasonSegment, in: query, required: false, schema: { type: string, enum: [Post All-Star, Pre All-Star], nullable: true } }
        - { name: SeasonType, in: query, required: false, schema: { type: string, enum: [Regular Season, Pre Season, Playoffs, All Star], nullable: true } }
        - { name: ShotClockRange, in: query, required: false, schema: { type: string, nullable: true } }
        - { name: TeamID, in: query, required: false, schema: { type: integer, nullable: true }, example: 1610612747 }
        - { name: VsConference, in: query, required: false, schema: { type: string, enum: [East, West], nullable: true } }
        - { name: VsDivision, in: query, required: false, schema: { type: string, enum: [Atlantic, Central, Northwest, Pacific, Southeast, Southwest, East, West], nullable: true } }
