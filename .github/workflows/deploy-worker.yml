name: Deploy NBA Proxy Worker

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to deploy (defaults to this workflow's ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-proxy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check gateway and Node proxy
        run: pnpm typecheck

      - name: Test gateway and Node proxy
        run: pnpm test

      - name: Compile Worker and build its Node container
        run: pnpm build:worker

      - name: Deploy gateway and Node container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.worker.jsonc
