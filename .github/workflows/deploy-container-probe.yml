name: Deploy NBA Container Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-container-probe
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and test
        run: |
          pnpm typecheck
          pnpm test

      - name: Compile Worker and build container
        run: pnpm check:container-worker

      - name: Deploy isolated container probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CONTAINER_PROBE_TOKEN: ${{ secrets.CONTAINER_PROBE_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          if (!process.env.CONTAINER_PROBE_TOKEN) {
            throw new Error('Set the CONTAINER_PROBE_TOKEN secret in the prod environment.');
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/nba-probe-secrets.json`,
            JSON.stringify({ PROBE_TOKEN: process.env.CONTAINER_PROBE_TOKEN }), { mode: 0o600 });
          JS
          trap 'rm -f "$RUNNER_TEMP/nba-probe-secrets.json"' EXIT
          pnpm exec wrangler deploy --config wrangler.container.jsonc --secrets-file "$RUNNER_TEMP/nba-probe-secrets.json"
